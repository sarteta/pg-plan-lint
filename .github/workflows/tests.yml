name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q
      - name: smoke -- bad plan should produce findings
        run: |
          ! pg-plan-lint tests/fixtures/seq_scan_filter.json --fail-on warning
      - name: smoke -- clean plan should pass
        run: pg-plan-lint tests/fixtures/clean_index_scan.json --fail-on warning
